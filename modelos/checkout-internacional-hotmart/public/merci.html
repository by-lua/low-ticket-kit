<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="extra.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<main class="checkout-page min-h-dvh">
  <div class="mx-auto w-full max-w-xl px-4 py-12 text-center">
    <div class="rounded-2xl border border-gold/25 bg-white p-8 shadow-[0_20px_45px_-30px_rgba(42,22,8,0.35)]">
      <p class="text-xs font-semibold uppercase tracking-widest" style="color:var(--color-gold-deep)">Checkout</p>
      <h1 id="title" class="mt-3 text-2xl font-bold text-neutral-900">Vérification de votre paiement…</h1>
      <p id="msg" class="mt-3 text-sm text-neutral-500">Un instant, nous confirmons votre commande.</p>
      <p id="foot" class="mt-6 text-xs text-neutral-400">Votre accès est envoyé par e-mail. Garantie de 15 jours.</p>
    </div>
    <!-- Upsell de 1 clique (Petit Lenormand): preço pós-compra ainda não definido pela dona; não exibido. -->
  </div>
</main>
<script type="module">
import { makeT } from './i18n.js';
(async () => {
  const q = new URLSearchParams(location.search), id = q.get('order');
  let lang = q.get('lang'); try { lang = lang || sessionStorage.getItem('gt_lang'); } catch {} lang = lang || 'fr';
  const tr = makeT(lang); document.documentElement.lang = lang;
  document.getElementById('title').textContent = tr('thTitle'); document.getElementById('msg').textContent = tr('thMsg'); document.getElementById('foot').textContent = tr('thFoot');
  const set = (t, m) => { document.getElementById('title').textContent = t; document.getElementById('msg').textContent = m; };
  if (!id) return set(tr('thNone'), tr('thNoneMsg'));
  // The return page NEVER grants access: it only reads the order state set by the signed webhook / server capture.
  for (let i = 0; i < 30; i++) {
    try {
      const r = await fetch('/api/order?id=' + encodeURIComponent(id)); const o = await r.json();
      if (o.status === 'paid') {
        set(tr('thPaid'), tr('thPaidMsg'));
        const key = 'purchase_' + id; // browser pixel purchase with the SAME event_id as the server mirror (dedup)
        if (!sessionStorage.getItem(key)) { sessionStorage.setItem(key, '1'); navigator.sendBeacon('/api/track', new Blob([JSON.stringify({ event: 'Purchase', orderRef: id, value: o.total / 100, currency: o.currency.toUpperCase() })], { type: 'application/json' })); }
        return;
      }
      if (o.status === 'failed') return set(tr('thFail'), tr('thFailMsg'));
    } catch {}
    await new Promise((r) => setTimeout(r, 1500));
  }
  set(tr('thPending'), tr('thPendingMsg'));
})();
</script>
</body>
</html>
