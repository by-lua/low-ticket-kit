# TRILHA-CHECKLIST — todo passo e subpasso do método, com evidência VERIFICÁVEL por máquina.
# Lido por scripts/gate.py. Fonte ÚNICA da lista de itens: a regra do item mora na skill_fonte;
# aqui mora só "o que tem que existir" (evidência). Nada é "opcional": ou é `sempre`, ou tem condição explícita.
#
# Formato (subconjunto de YAML que o gate.py parseia sem dependência): lista de itens, chaves planas,
# `evidencia` = lista de checagens `- tipo: valor`. TODAS as checagens do item têm que passar (AND).
#
# obrigatorio  (sempre | condição; condição falsa => item "N/A", nunca "opcional"):
#   sempre                — todo modo
#   r4_nicho              — R4 do ROTEADOR tem nicho/persona (não "amplo")
#   cross                 — origem != destino (modos B, B2, C, P, ou D/E/F combinados com mercado)
#   modo:A,E,F            — modo primário (R2) está na lista
#   formato_mudou         — alguma modelagem tem elemento_mudado = formato
#   comunicacao_mudou     — alguma modelagem tem elemento_mudado = comunicação (ou persona/dor/desejo)
#   pivo                  — existe concepção/oferta que apareceu DEPOIS do T7 (Obra sem T7-T10 próprio) — ver REGRA DE PIVÔ
#   oferta_app | oferta_app_sensivel — (por oferta) Obra é APP/calculadora/gerador | e tem `área sensível: SIM`
#   cross_construcao      — cross (= cross) na fase de construção
#   construcao            — a rodada chegou em T12 liberada (linha "Parada 3 LIBERADA" no ESTADO)
# retroativo: sim — item de regra criada em 25/09/2026; rodada aberta antes dela aceita no ESTADO a linha
#   "RETROATIVO: regra criada em DD/MM, passo feito antes; auditoria <arquivo> [itens: T4.2 T4.3]" (arquivo tem que existir)
# Oferta com status perdeu/pausada/encerrada/descartada ou semáforo VERMELHA (Hub) sai [N/A — encerrada: motivo] nos itens de nível oferta.
# nivel: rodada (pasta da rodada) | concepcao (--concepcao <id>; sem id = agregado no Hub) | oferta (OFERTAS/<id>; --oferta ou auto)
#
# Tipos de evidência:
#   arquivo: glob         — existe (relativo à rodada; prefixo `oferta/` = OFERTAS/<id>/)
#   arquivo_contem: "glob :: regex"   — algum arquivo do glob contém o regex (case/acento-insensitivo)
#   arquivo_sem: "glob :: regex"      — NENHUM arquivo do glob contém o regex (checagem de padrão proibido)
#   estado: regex         — ESTADO.md tem linha com o regex
#   hub: <checagem>       — checagem nomeada do Hub (ver gate.py: HUB_CHECKS)
#   mtime_antes: "a | b"   — arquivo a existe e é anterior (mtime) a b
#   arquivo_recente: "glob :: horas" — arquivo modificado há ≤ N horas
#   condicao_bloqueante: verde — Obra VERDE sem "com condição/ressalva", ou com linha `CONDIÇÃO →` no ESTADO
#   oferta_coberta: <passo> — cada oferta com Obra tem artefato próprio daquele passo (ver gate.py: COBERTURA)

